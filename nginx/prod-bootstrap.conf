# Временный конфиг — только на время первого запуска.
#
# Нужен потому, что nginx с боевым конфигом не стартует, пока нет файла
# сертификата, а сертификат нельзя получить, пока не отвечает nginx. Здесь
# открыт только 80-й порт: этого хватает, чтобы Let's Encrypt проверил домен.
#
# Как только сертификат выпущен, scripts/deploy.sh заменяет active.conf на
# боевой и перезапускает nginx. Приложение при этом уже работает — по http,
# несколько секунд.
#
# Имя узла подставляется скриптом вместо __DOMAIN__.
server {
    listen 80;
    server_name __DOMAIN__;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://api:8000;

    client_max_body_size 30m;

    # Проверка владения доменом.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location /api/ {
        proxy_pass $api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
    }

    location /django-admin/ {
        proxy_pass $api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
    }

    location = /health/ {
        proxy_pass $api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
        access_log off;
    }

    location /ws/ {
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        access_log off;
    }

    location ^~ /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
    }

    location ^~ /media/ {
        alias /usr/share/nginx/media/;
    }

    root /usr/share/nginx/web;
    index index.html;

    # Файлы сборки отдаются как есть. Без отдельного блока отсутствующий
    # скрипт получал бы index.html с кодом 200, и браузер падал бы на разборе
    # HTML вместо понятного «файл не найден».
    location ^~ /assets/ {
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
