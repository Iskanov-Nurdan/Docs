# Заголовки безопасности.
#
# Вынесены в отдельный файл не для красоты: `add_header` в блоке location
# отменяет все заголовки, заданные выше. Стоит поставить в location свой
# Cache-Control — и HSTS с nosniff молча пропадают именно там, где страницу
# и отдают. Поэтому файл подключается в каждом таком блоке.

# Полгода: столько браузер будет ходить сюда только по https, даже если адрес
# набрали без него.
add_header Strict-Transport-Security "max-age=15768000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Камера, микрофон и геопозиция приложению не нужны ни в одном сценарии.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
