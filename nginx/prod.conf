# Боевой nginx: TLS, проксирование к приложению, раздача статики.
#
# Файл не подключается напрямую — scripts/deploy.sh кладёт его в
# nginx/active.conf, когда сертификат уже выпущен. До этого там лежит
# prod-bootstrap.conf: без файла сертификата nginx с этим конфигом не стартует.
#
# Имя узла подставляется скриптом вместо __DOMAIN__.

# Ограничение частоты запросов к API: подбор пароля и выгрузка чужих таблиц
# перебором адресов упираются в него раньше, чем в приложение. Зона общая на
# все рабочие процессы, 10 МБ хватает примерно на 160 тысяч адресов.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

# Сжатие включаем здесь, а не в каждом сервисе: трафик наружу идёт отсюда.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml font/woff2;

server {
    listen 80;
    server_name __DOMAIN__;
    server_tokens off;

    # Проверка владения доменом при продлении сертификата. Должна оставаться
    # доступной по http: certbot ходит именно туда и редирект не любит.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Имена служб резолвятся на каждый запрос, а не один раз при старте:
    # после пересборки контейнер получает новый адрес, и закешированный
    # старый давал бы 502 до перезапуска nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://api:8000;

    # Таблица с картинками и переносимый DOCX — это мегабайты.
    client_max_body_size 30m;

    include /etc/nginx/security_headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # Вход, сброс пароля и обновление токенов — отдельная, более строгая мера:
    # эти адреса подбирают, а не используют по многу раз в секунду.
    location ~ ^/api/auth/(login|password)/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass $api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
    }

    location /django-admin/ {
        proxy_pass $api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
    }

    location = /health/ {
        proxy_pass $api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
        access_log off;
    }

    # Совместная правка: соединение живёт часами, пока открыта вкладка.
    location /ws/ {
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Токен доступа идёт параметром запроса: в журнал ему попадать нельзя.
        access_log off;
    }

    # Статика Django (панель администратора) и загруженные файлы — с диска,
    # минуя приложение.
    location ^~ /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
        access_log off;
    }

    location ^~ /media/ {
        alias /usr/share/nginx/media/;
        expires 1d;
    }

    # Всё остальное — собранный фронтенд с диска. Отдельного контейнера под
    # него нет: это готовые файлы, и nginx раздаёт их сам.
    root /usr/share/nginx/web;
    index index.html;

    location ^~ /assets/ {
        # Имя файла содержит отпечаток содержимого: новая сборка — новое имя,
        # поэтому старый файл можно держать в кеше сколько угодно. Задаём одним
        # заголовком, а не вместе с expires: тот добавляет второй Cache-Control,
        # и в ответе их оказывается два.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security_headers.conf;
        access_log off;
    }

    # Приложение одностраничное: любой адрес отдаёт index.html, маршрут
    # разбирает уже клиент.
    location / {
        try_files $uri $uri/ /index.html;
        # Сам index.html не кешируем: иначе после выкладки люди неделю видели
        # бы старую версию, сколько бы раз ни обновляли страницу.
        add_header Cache-Control "no-cache";
        include /etc/nginx/security_headers.conf;
    }
}
