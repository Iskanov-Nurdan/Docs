upstream api_backend {
    server api:8000;
}

upstream frontend_dev {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Документ с картинками и импортируемый DOCX — это мегабайты.
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api_backend;
        include /etc/nginx/proxy_params_custom.conf;
    }

    location /django-admin/ {
        proxy_pass http://api_backend;
        include /etc/nginx/proxy_params_custom.conf;
    }

    location /health/ {
        proxy_pass http://api_backend;
        include /etc/nginx/proxy_params_custom.conf;
        access_log off;
    }

    location ^~ /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
        access_log off;
    }

    location ^~ /media/ {
        alias /usr/share/nginx/media/;
        expires 1d;
    }

    # WebSocket документа: соединение живёт часами, пока открыта вкладка,
    # поэтому таймаут чтения намеренно большой.
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Токен доступа приходит параметром запроса: в журнал он попасть
        # не должен, поэтому запись обращений здесь выключена.
        access_log off;
    }

    # Всё остальное — сервер разработки Vite вместе с его горячей перезагрузкой.
    location / {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
