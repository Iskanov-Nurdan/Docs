# Блоки upstream здесь не годятся: имя в них разрешается один раз при запуске
# и кешируется навсегда. После `docker compose up -d --build` контейнер
# получает новый адрес, а nginx продолжает стучаться на старый и отдаёт 502,
# пока его не перезапустят вручную. Поэтому адрес подставляется переменной —
# её nginx разрешает на каждый запрос через встроенный DNS Docker.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # 127.0.0.11 — DNS внутри сети Docker. valid=10s ограничивает кеш ответа.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend   http://api:8000;
    set $frontend_dev  http://frontend:5173;

    # Документ с картинками и импортируемый DOCX — это мегабайты.
    client_max_body_size 30m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass $api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
    }

    location /django-admin/ {
        proxy_pass $api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
    }

    location /health/ {
        proxy_pass $api_backend$request_uri;
        include /etc/nginx/proxy_params_custom.conf;
        access_log off;
    }

    location ^~ /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
        access_log off;
    }

    location ^~ /media/ {
        alias /usr/share/nginx/media/;
        expires 1d;
    }

    # WebSocket документа: соединение живёт часами, пока открыта вкладка,
    # поэтому таймаут чтения намеренно большой.
    location /ws/ {
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Токен доступа приходит параметром запроса: в журнал он попасть
        # не должен, поэтому запись обращений здесь выключена.
        access_log off;
    }

    # Всё остальное — сервер разработки Vite вместе с его горячей перезагрузкой.
    location / {
        proxy_pass $frontend_dev$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
