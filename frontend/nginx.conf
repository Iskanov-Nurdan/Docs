server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Приложение одностраничное: любой адрес отдаёт index.html,
    # маршрут разбирает уже сам клиент.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
