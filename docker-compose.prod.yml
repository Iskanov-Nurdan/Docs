# Боевой контур. Разворачивается одной командой: ./scripts/deploy.sh
#
# Отличия от docker-compose.yml (разработка):
#
# * код не монтируется с хоста — он внутри образа, и контейнер нельзя изменить
#   правкой файла на сервере: обновление идёт только пересборкой;
# * наружу открыты только 80 и 443. База, Redis и приложение доступны лишь
#   внутри сети docker — снаружи к ним не подключиться даже с самого сервера;
# * фронтенд приезжает уже собранным, папкой web/ — nginx раздаёт её как есть.
#   Сервер не держит ни node, ни зависимостей, ни исходников фронта;
# * сертификат TLS выпускает и продлевает certbot, nginx перечитывает его сам.
name: docs-prod

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docs}
      POSTGRES_USER: ${POSTGRES_USER:-docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docs} -d ${POSTGRES_DB:-docs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: docs-api:latest
    restart: unless-stopped
    env_file: [./.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    # Миграции применяет только этот контейнер: worker и beat стартуют на
    # готовой базе. Два одновременных migrate на одной базе — гонка.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [backend]

  worker:
    # Тот же образ, что у приложения, и та же сборка. Без секции build compose
    # при первом запуске пытается скачать docs-api из реестра, которого нет,
    # и падает на «pull access denied» ещё до того, как образ соберётся.
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: docs-api:latest
    restart: unless-stopped
    env_file: [./.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    command: celery -A config worker --loglevel=warning --concurrency=2
    # Проверка своя: образ общий с веб-частью, и унаследованный запрос к
    # порту 8000 у обработчика очереди всегда падал — контейнер вечно
    # числился больным, хотя задачи выполнял.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - media_files:/app/mediafiles
    depends_on:
      api: {condition: service_started}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend]

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: docs-api:latest
    restart: unless-stopped
    env_file: [./.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    command: celery -A config beat --loglevel=warning --schedule=/tmp/celerybeat-schedule
    # У расписания нет ни порта, ни очереди. Смотрим отметку времени, которую
    # оно обновляет при каждом срабатывании: файла свежее пяти минут достаточно,
    # чтобы понять, что оно живо. Утилит вроде pgrep в образе нет.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; f='/tmp/celerybeat-schedule'; sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f) < 300 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api: {condition: service_started}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Какой из конфигов здесь лежит, решает scripts/deploy.sh: до выпуска
      # сертификата — временный, без TLS; после — боевой.
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params_custom.conf:/etc/nginx/proxy_params_custom.conf:ro
      - ./nginx/security_headers.conf:/etc/nginx/security_headers.conf:ro
      - static_files:/usr/share/nginx/static:ro
      - media_files:/usr/share/nginx/media:ro
      # Собранный фронтенд. Сюда кладут готовый dist — сборкой сервер не
      # занимается: node, зависимости и исходники ему для этого не нужны.
      # Путь можно сменить через WEB_DIR в .env, если статика лежит не рядом
      # с этим файлом, а, скажем, в /opt/alitrade/frontend.
      - ${WEB_DIR:-./web}:/usr/share/nginx/web:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    # Сертификат меняется раз в два месяца, а конфигурацию nginx кеширует при
    # старте. Перечитываем раз в шесть часов — так продление подхватывается
    # без вмешательства руками.
    command: >
      sh -c "while :; do sleep 6h; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      - api
    networks: [backend]

  # Выпуск и продление сертификата. Проверка идёт каждые 12 часов: Let's Encrypt
  # обновляет сертификат за 30 дней до конца срока, частить незачем.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"
    networks: [backend]

volumes:
  postgres_data:
  static_files:
  media_files:
  certbot_certs:
  certbot_webroot:

networks:
  backend:
    driver: bridge
